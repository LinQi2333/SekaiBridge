<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    .title { font-size:20px; font-weight:bold; fill:#1f2328; }
    .box-title { font-size:15px; font-weight:bold; }
    .box-sub { font-size:11px; fill:#57606a; }
    .edge-label { font-size:11px; fill:#57606a; }
  </style>

  <text x="480" y="30" text-anchor="middle" class="title">Twitter/X → QQ 翻译协作 → Bilibili 动态发布系统（架构）</text>

  <!-- 顶部：Twitter/X -->
  <rect x="60" y="55" width="230" height="54" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="175" y="78" text-anchor="middle" class="box-title">Twitter / X</text>
  <text x="175" y="96" text-anchor="middle" class="box-sub">被监听账户的推文</text>

  <!-- 顶部：QQ 群 -->
  <rect x="665" y="55" width="230" height="54" rx="8" fill="#e6f7ee" stroke="#1a7f37"/>
  <text x="780" y="78" text-anchor="middle" class="box-title">QQ 群（翻译工作台）</text>
  <text x="780" y="96" text-anchor="middle" class="box-sub">讨论 / 提交翻译 / 发布</text>

  <!-- 左：TweetToaster -->
  <rect x="60" y="160" width="230" height="92" rx="8" fill="#fff8e6" stroke="#bf8700"/>
  <text x="175" y="186" text-anchor="middle" class="box-title">TweetToaster</text>
  <text x="175" y="206" text-anchor="middle" class="box-sub">FxTwitter / FxEmbed 数据源</text>
  <text x="175" y="224" text-anchor="middle" class="box-sub">Chromium 推文截图渲染</text>
  <text x="175" y="242" text-anchor="middle" class="box-sub">端口 :8082</text>

  <!-- 右：NoneBot2 + NapCat -->
  <rect x="665" y="160" width="230" height="92" rx="8" fill="#f1e8fd" stroke="#8250df"/>
  <text x="780" y="186" text-anchor="middle" class="box-title">NoneBot2 + NapCat</text>
  <text x="780" y="206" text-anchor="middle" class="box-sub">QQ 消息收发（OneBot 11）</text>
  <text x="780" y="224" text-anchor="middle" class="box-sub">命令解析 / 图片发送</text>
  <text x="780" y="242" text-anchor="middle" class="box-sub">调用 Node HTTP API</text>

  <!-- 箭头 -->
  <line x1="175" y1="109" x2="175" y2="160" stroke="#57606a" marker-end="url(#arrow)"/>
  <line x1="780" y1="109" x2="780" y2="160" stroke="#57606a" marker-end="url(#arrow)"/>
  <line x1="175" y1="252" x2="175" y2="300" stroke="#57606a" marker-end="url(#arrow)"/>
  <text x="190" y="282" class="edge-label">推文数据 / 截图 URL</text>
  <line x1="780" y1="252" x2="780" y2="300" stroke="#57606a" marker-end="url(#arrow)"/>
  <text x="795" y="282" class="edge-label">HTTP 调用（X-API-Token）</text>

  <!-- 中部：Node 主程序 -->
  <rect x="180" y="300" width="600" height="252" rx="12" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="480" y="326" text-anchor="middle" class="box-title" fill="#0969da">Node 主程序（本仓库，TypeScript + SQLite）</text>

  <!-- 左列 -->
  <rect x="205" y="342" width="210" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="310" y="362" text-anchor="middle" class="box-title">Monitor 监听</text>
  <text x="310" y="380" text-anchor="middle" class="box-sub">轮询 / bootstrap / 去重</text>
  <rect x="205" y="406" width="210" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="310" y="426" text-anchor="middle" class="box-title">新推文处理管线</text>
  <text x="310" y="444" text-anchor="middle" class="box-sub">截图 / 媒体缓存 / QQ 通知</text>
  <rect x="205" y="470" width="210" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="310" y="490" text-anchor="middle" class="box-title">来源检查</text>
  <text x="310" y="508" text-anchor="middle" class="box-sub">SOURCE_DELETED</text>

  <!-- 右列 -->
  <rect x="545" y="342" width="210" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="650" y="362" text-anchor="middle" class="box-title">Application Services</text>
  <text x="650" y="380" text-anchor="middle" class="box-sub">翻译 / 话题 / 发布 / 查询</text>
  <rect x="545" y="406" width="210" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="650" y="426" text-anchor="middle" class="box-title">HTTP API :18080</text>
  <text x="650" y="444" text-anchor="middle" class="box-sub">NoneBot2 / 未来 Web 复用</text>
  <rect x="545" y="470" width="210" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="650" y="490" text-anchor="middle" class="box-title">SQLite + 媒体缓存</text>
  <text x="650" y="508" text-anchor="middle" class="box-sub">data/app.db · cache/</text>

  <!-- 底部：Bilibili -->
  <line x1="480" y1="552" x2="480" y2="596" stroke="#57606a" marker-end="url(#arrow)"/>
  <rect x="330" y="596" width="300" height="52" rx="8" fill="#ffeef0" stroke="#cf222e"/>
  <text x="480" y="620" text-anchor="middle" class="box-title">Bilibili</text>
  <text x="480" y="638" text-anchor="middle" class="box-sub">图片上传 / 动态发布（BILI Cookie）</text>
</svg>
