<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>
  <style>
    .title { font-size:20px; font-weight:bold; fill:#1f2328; }
    .ext-title { font-size:14px; font-weight:bold; }
    .node-title { font-size:16px; font-weight:bold; fill:#0969da; }
    .col-title { font-size:13px; font-weight:bold; fill:#57606a; }
    .box-title { font-size:12px; font-weight:bold; }
    .box-sub { font-size:10px; fill:#57606a; }
    .mono { font-family:'Consolas','Menlo',monospace; font-size:9.5px; fill:#1f2328; }
    .edge-label { font-size:10.5px; fill:#0969da; font-weight:bold; }
    .edge-sub { font-size:9px; fill:#57606a; }
  </style>

  <text x="620" y="28" text-anchor="middle" class="title">Twitter/X → QQ 翻译协作 → Bilibili 动态发布系统（接口协作图）</text>

  <!-- ============ 外部平台（行 1） ============ -->
  <!-- Twitter/X -->
  <rect x="60" y="50" width="180" height="52" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="150" y="72" text-anchor="middle" class="ext-title">Twitter / X</text>
  <text x="150" y="90" text-anchor="middle" class="box-sub">公开推文（无需登录）</text>

  <!-- QQ 群 -->
  <rect x="940" y="50" width="240" height="44" rx="8" fill="#e6f7ee" stroke="#1a7f37"/>
  <text x="1060" y="77" text-anchor="middle" class="ext-title">QQ 群（翻译工作台）</text>

  <!-- NoneBot2 + NapCat -->
  <rect x="940" y="108" width="240" height="80" rx="8" fill="#f1e8fd" stroke="#8250df"/>
  <text x="1060" y="132" text-anchor="middle" class="box-title">NoneBot2 + NapCat（OneBot 11）</text>
  <text x="1060" y="150" text-anchor="middle" class="box-sub">命令解析 / 图片发送 / 通知轮询</text>
  <text x="1060" y="166" text-anchor="middle" class="box-sub">每个请求先调 POST /api/messages/dedupe</text>

  <!-- QQ → NoneBot2 -->
  <line x1="1060" y1="94" x2="1060" y2="108" stroke="#57606a" marker-end="url(#arrow)"/>
  <text x="1072" y="104" class="edge-sub">OneBot 11 WS</text>

  <!-- ============ TweetToaster（端点清单） ============ -->
  <rect x="60" y="180" width="310" height="150" rx="8" fill="#fff8e6" stroke="#bf8700"/>
  <text x="215" y="204" text-anchor="middle" class="ext-title">TweetToaster（独立服务 · :8082）</text>
  <text x="78" y="226" class="mono">POST /api/tweet          {url} → 标准化推文 JSON</text>
  <text x="78" y="244" class="mono">POST /api/render         截图任务 → {task_id}</text>
  <text x="78" y="262" class="mono">POST /api/auto           旧 Bot 兼容任务</text>
  <text x="78" y="280" class="mono">GET  /api/get_task=&lt;id&gt; → {state,result}</text>
  <text x="78" y="298" class="mono">GET  /api/health         → {status,version}</text>
  <text x="78" y="320" class="box-sub">数据源：FxTwitter / FxEmbed（TWEET_PROVIDER_URL）</text>

  <!-- Twitter → TweetToaster -->
  <line x1="150" y1="102" x2="150" y2="180" stroke="#57606a" marker-end="url(#arrow)"/>
  <text x="160" y="150" class="edge-sub">拉取公开推文</text>

  <!-- ============ Bilibili ============ -->
  <rect x="470" y="836" width="300" height="66" rx="8" fill="#ffeef0" stroke="#cf222e"/>
  <text x="620" y="860" text-anchor="middle" class="ext-title">Bilibili</text>
  <text x="620" y="878" text-anchor="middle" class="box-sub">POST api.vc.bilibili.com/api/v1/web/image（图片上传）</text>
  <text x="620" y="894" text-anchor="middle" class="box-sub">POST api.vc.bilibili.com/dynamic_svr/v1/dynamic_svr/create（动态发布）</text>

  <!-- ============ Node 主程序 ============ -->
  <rect x="60" y="380" width="1120" height="432" rx="12" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="620" y="408" text-anchor="middle" class="node-title">Node 主程序（本仓库 · TypeScript · 进程内方法调用）</text>

  <!-- 左列：客户端封装 -->
  <rect x="80" y="424" width="270" height="300" rx="8" fill="#eef8fb" stroke="#54aeff"/>
  <text x="215" y="446" text-anchor="middle" class="col-title">客户端封装（对外 HTTP）</text>
  <rect x="94" y="458" width="242" height="66" rx="6" fill="#ffffff" stroke="#54aeff"/>
  <text x="215" y="478" text-anchor="middle" class="box-title">TweetToasterClient</text>
  <text x="215" y="494" text-anchor="middle" class="box-sub">getTimeline(@user) / getTweet(url)</text>
  <text x="215" y="508" text-anchor="middle" class="box-sub">render() 轮询任务 → PNG URL</text>
  <rect x="94" y="532" width="242" height="66" rx="6" fill="#ffffff" stroke="#54aeff"/>
  <text x="215" y="552" text-anchor="middle" class="box-title">BilibiliClient</text>
  <text x="215" y="568" text-anchor="middle" class="box-sub">uploadImage(buffer, filename)</text>
  <text x="215" y="582" text-anchor="middle" class="box-sub">publishDynamic({text, pics, topicId})</text>
  <rect x="94" y="606" width="242" height="66" rx="6" fill="#ffffff" stroke="#54aeff"/>
  <text x="215" y="626" text-anchor="middle" class="box-title">safeDownload（媒体下载）</text>
  <text x="215" y="642" text-anchor="middle" class="box-sub">HTTP/HTTPS · 超时 · 大小上限</text>
  <text x="215" y="656" text-anchor="middle" class="box-sub">Content-Type 图片白名单</text>

  <!-- 中列：业务服务 -->
  <rect x="366" y="424" width="356" height="300" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="544" y="446" text-anchor="middle" class="col-title">业务服务层（Application Services）</text>
  <rect x="380" y="456" width="160" height="52" rx="6" fill="#f0f7ff" stroke="#0969da"/>
  <text x="460" y="474" text-anchor="middle" class="box-title">Monitor 监听</text>
  <text x="460" y="490" text-anchor="middle" class="box-sub">pollOnce → getTimeline()</text>
  <rect x="548" y="456" width="160" height="52" rx="6" fill="#f0f7ff" stroke="#0969da"/>
  <text x="628" y="474" text-anchor="middle" class="box-title">来源检查</text>
  <text x="628" y="490" text-anchor="middle" class="box-sub">checkTweet → getTweet()</text>
  <rect x="380" y="516" width="328" height="52" rx="6" fill="#f0f7ff" stroke="#0969da"/>
  <text x="544" y="534" text-anchor="middle" class="box-title">新推文处理管线</text>
  <text x="544" y="550" text-anchor="middle" class="box-sub">screenshot.render() → media.cache*() → notifications.create()</text>
  <rect x="380" y="576" width="328" height="52" rx="6" fill="#f0f7ff" stroke="#0969da"/>
  <text x="544" y="594" text-anchor="middle" class="box-title">翻译 / 话题 / 查询 / 工作流</text>
  <text x="544" y="610" text-anchor="middle" class="box-sub">submit() · setTopic() · list() · transition()</text>
  <rect x="380" y="636" width="328" height="60" rx="6" fill="#f0f7ff" stroke="#0969da"/>
  <text x="544" y="656" text-anchor="middle" class="box-title">PublishService</text>
  <text x="544" y="672" text-anchor="middle" class="box-sub">publish(tweetId) · 幂等（§38）· 失败可重试</text>
  <text x="544" y="688" text-anchor="middle" class="box-sub">只传 photo · 视频/封面排除（§53）</text>

  <!-- 右列：HTTP API -->
  <rect x="738" y="424" width="424" height="300" rx="8" fill="#faf5ff" stroke="#8250df"/>
  <text x="950" y="446" text-anchor="middle" class="col-title">HTTP API（REST · :18080）</text>
  <text x="752" y="464" class="box-sub">鉴权：X-API-Token · X-QQ-User · X-QQ-Group（权限按 §41）</text>
  <text x="752" y="484" class="mono">GET   /api/health</text>
  <text x="752" y="502" class="mono">GET|POST|PATCH|DELETE /api/watched-accounts*</text>
  <text x="752" y="520" class="mono">GET   /api/tweets?status=&amp;page=&amp;ids=1,2</text>
  <text x="752" y="538" class="mono">GET   /api/tweets/:id</text>
  <text x="752" y="556" class="mono">POST  /api/tweets/:id/translation {text, qq_user_id}</text>
  <text x="752" y="574" class="mono">POST  /api/tweets/:id/topic {alias|null}</text>
  <text x="752" y="592" class="mono">POST  /api/tweets/:id/publish {topic_alias?}（管理员）</text>
  <text x="752" y="610" class="mono">POST  /api/tweets/:id/retry（管理员）</text>
  <text x="752" y="628" class="mono">GET   /api/notifications · POST /:id/ack</text>
  <text x="752" y="646" class="mono">POST  /api/messages/dedupe {message_id}</text>
  <text x="752" y="668" class="box-sub">错误：{ok:false, error:{code,message}} · 404/400/403/409/401/502</text>
  <text x="752" y="690" class="box-sub">PublishService 未实现时 501（Phase 8 已实现）</text>

  <!-- 数据层 -->
  <rect x="80" y="740" width="1080" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="620" y="762" text-anchor="middle" class="box-title">数据层：Repositories → SQLite（WAL · foreign_keys=ON）</text>
  <text x="620" y="782" text-anchor="middle" class="box-sub">tweets · translations · bili_topics · publish_records · watched_accounts · qq_notifications · qq_messages</text>

  <!-- 缓存行（Node 内底部小字） -->
  <text x="620" y="806" text-anchor="middle" class="edge-sub">媒体缓存：cache/screenshots/&lt;id&gt;.png · cache/twitter-photos/&lt;id&gt;/&lt;i&gt;.&lt;ext&gt; · cache/video-thumbnails/&lt;id&gt;/&lt;i&gt;.&lt;ext&gt;</text>

  <!-- ============ 外部箭头（带协议标注） ============ -->

  <!-- TweetToaster → Node（TweetToasterClient） -->
  <line x1="215" y1="330" x2="215" y2="380" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="225" y="360" class="edge-label">HTTP JSON</text>
  <text x="225" y="374" class="edge-sub">POST /api/tweet · /api/render · /api/get_task=&lt;id&gt;</text>

  <!-- NoneBot2 → Node（HTTP API） -->
  <line x1="1060" y1="188" x2="1060" y2="380" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="1070" y="290" class="edge-label">REST 调用</text>
  <text x="1070" y="304" class="edge-sub">X-API-Token</text>
  <text x="1070" y="318" class="edge-sub">X-QQ-User / X-QQ-Group</text>

  <!-- 服务层 → Bilibili（经 BilibiliClient） -->
  <line x1="620" y1="812" x2="620" y2="836" stroke="#cf222e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="632" y="828" class="edge-label">wbi 签名 + BILI Cookie</text>
  <text x="632" y="842" class="edge-sub">multipart/form-data · csrf=bili_jct</text>

  <!-- 内部：HTTP API → 服务层（进程内） -->
  <line x1="734" y1="574" x2="722" y2="574" stroke="#8250df" marker-end="url(#arrow)"/>
  <text x="710" y="560" class="edge-sub" text-anchor="end">services.* 调用</text>

  <!-- 内部：服务层 → 数据层 -->
  <line x1="544" y1="724" x2="544" y2="740" stroke="#57606a" marker-end="url(#arrow)"/>
  <text x="556" y="736" class="edge-sub">SQL / 事务</text>
</svg>
