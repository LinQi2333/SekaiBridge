# SekaiBridge（世界桥）—— PJSK 推文搬运：Twitter/X → QQ 翻译协作 → Bilibili 动态发布
# Linux / Docker 一键部署（推荐）：
#   ./start.sh
#   docker compose logs -f napcat     # 查看 WebUI token
#   浏览器打开 http://<服务器IP>:6099/webui → 扫码登录机器人 QQ
#   （如 3001 未监听：WebUI 网络配置中新建 WebSocket 服务，端口 3001）

name: sekai-bridge

services:
  tweettoaster:
    image: ghcr.io/cn-matsuri/tweettoaster:latest
    restart: unless-stopped
    shm_size: 512m
    environment:
      # 可选代理：国内服务器访问 Twitter 图床（pbs.twimg.com）被墙时，
      # 在 .env 配 HTTPS_PROXY=http://你的代理:端口，主程序与 TweetToaster 同时生效
      # （TweetToaster 通过 Node --use-env-proxy 读取代理环境变量；
      #   若镜像 Node < 22.10 不支持该标志，需改用注入脚本方案，见 docs/DEPLOYMENT.md）
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - NODE_OPTIONS=${TWEETTOASTER_NODE_OPTIONS:-}
    volumes:
      - tweettoaster-cache:/app/Matsuri_translation/frontend/cache
    # 主程序通过容器内网访问；如需本机调试可取消注释
    # ports:
    #   - "127.0.0.1:8082:8082"

  app:
    image: sekai-bridge/app
    build: .
    restart: unless-stopped
    depends_on:
      - tweettoaster
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/app.db
      CACHE_ROOT: /app/cache
      TWEETTOASTER_URL: http://tweettoaster:8082
      TWITTER_POLL_INTERVAL: ${TWITTER_POLL_INTERVAL:-60}
      SOURCE_CHECK_INTERVAL: ${SOURCE_CHECK_INTERVAL:-1800}
      BOOTSTRAP_MODE: latest_only
      QQ_GROUP_IDS: ${QQ_GROUP_IDS:-}
      QQ_ADMIN_IDS: ${QQ_ADMIN_IDS:-}
      BILI_SESSDATA: ${BILI_SESSDATA:-}
      BILI_JCT: ${BILI_JCT:-}
      BILI_DEDEUSERID: ${BILI_DEDEUSERID:-}
      PUBLISH_MODE: manual
      API_PORT: 18080
      API_TOKEN: ${API_TOKEN:-}
      # 可选代理：访问 Twitter 图床被墙时配置（与 tweettoaster 共用）
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
    volumes:
      - app-data:/app/data
      - app-cache:/app/cache
    ports:
      - "127.0.0.1:18080:18080"

  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-0}
      - NAPCAT_GID=${NAPCAT_GID:-0}
    ports:
      - "6099:6099"   # WebUI（登录/管理；公网环境请勿暴露）
      - "3001:3001"   # OneBot WebSocket（供宿主机 NoneBot2 或调试）
    volumes:
      - napcat-qq:/app/.config/QQ
      - napcat-config:/app/napcat/config

  nonebot2:
    image: sekai-bridge/nonebot2
    build: ./nonebot-plugin
    restart: unless-stopped
    depends_on:
      - app
      - napcat
    environment:
      DRIVER: ~fastapi+~websockets+~httpx
      HOST: 0.0.0.0
      PORT: 8081
      ONEBOT_WS_URLS: '["ws://napcat:3001"]'
      TQB_API_BASE: http://app:18080
      TQB_API_TOKEN: ${API_TOKEN:-}
      TQB_NOTIFY_GROUP: ${QQ_GROUP_IDS:-}

volumes:
  tweettoaster-cache:
  app-data:
  app-cache:
  napcat-qq:
  napcat-config:
